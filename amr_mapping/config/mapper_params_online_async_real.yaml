slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    odom_topic: /odometry/filtered
    mode: mapping
    map_update_interval: 0.5
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 12.0
    update_rate: 15.0
    minimumScore: 25.0
